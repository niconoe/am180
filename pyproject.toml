[project]
name = "am180"
version = "0.1.0"
description = "Generative art tool: Python backend renders, Vue 3 frontend tweaks parameters live and exports high-res PNGs."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=2.0",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/am180"]
